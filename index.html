<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }

        /* The Score - Only text on screen */
        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            pointer-events: none;
            user-select: none;
        }

        /* The Cube - Sharp edges, no rounding */
        #cube {
            position: absolute;
            width: 60px;
            height: 60px;
            cursor: pointer;
            /* Ensuring edges stay perfectly sharp */
            border-radius: 0; 
        }
    </style>
</head>
<body>

    <div id="score">0</div>
    <div id="cube"></div>

    <script>
        let score = 0;
        const scoreDisplay = document.getElementById('score');
        const cube = document.getElementById('cube');
        
        // List of bright colors
        const brightColors = ['#00FF00', '#FF00FF', '#00FFFF', '#FFFF00', '#FF3131', '#39FF14', '#FF5E00'];

        function moveCube() {
            const maxX = window.innerWidth - cube.clientWidth;
            const maxY = window.innerHeight - cube.clientHeight;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            cube.style.left = randomX + 'px';
            cube.style.top = randomY + 'px';
            
            // Pick a random bright color
            const randomColor = brightColors[Math.floor(Math.random() * brightColors.length)];
            cube.style.backgroundColor = randomColor;
        }

        cube.addEventListener('mousedown', (e) => {
            score++;
            scoreDisplay.textContent = score;
            moveCube();
            e.preventDefault(); // Prevents accidental text selection/zooming
        });

        // Start the game
        moveCube();
    </script>
</body>
</html>
