<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickle Game</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }

        /* The Score - Only text on screen */
        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            pointer-events: none;
            user-select: none;
            z-index: 10;
        }

        /* The Pickle - Replaces the Cube */
        #pickle {
            position: absolute;
            width: 100px; /* Adjust size as needed */
            height: auto;
            cursor: pointer;
            user-select: none;
            -webkit-user-drag: none;
        }
    </style>
</head>
<body>

    <div id="score">0</div>
    <!-- Replaced the div with an img tag for your pickle -->
    <img src="pickle.png" id="pickle" alt="Pickle">

    <script>
        let score = 0;
        const scoreDisplay = document.getElementById('score');
        const pickle = document.getElementById('pickle');

        function movePickle() {
            const maxX = window.innerWidth - pickle.clientWidth;
            const maxY = window.innerHeight - pickle.clientHeight;
            
            // Randomly position the pickle
            const randomX = Math.floor(Math.random() * Math.max(0, maxX));
            const randomY = Math.floor(Math.random() * Math.max(0, maxY));
            
            pickle.style.left = randomX + 'px';
            pickle.style.top = randomY + 'px';
        }

        // Event listener for clicks/taps
        pickle.addEventListener('mousedown', (e) => {
            score++;
            scoreDisplay.textContent = score;
            movePickle();
            e.preventDefault(); 
        });

        // Initialize position once the image is loaded
        pickle.onload = movePickle;
        
        // Safety call in case image is already cached
        movePickle();
    </script>
</body>
</html>
